<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#5B7CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #FFC53D; }
      .l { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8FA3D8; }
      .v { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .big { font: 800 40px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  
  <rect x="0" y="0" width="316" height="260" rx="18" fill="#0A0E1A" stroke="#1C2438"/>
  <rect x="18" y="0" width="280" height="3" fill="url(#accent)"/>
  <text x="24" y="40" class="t">THUNDER STATS</text>
  <text x="24" y="84" class="l">Total Stars</text>
  <text x="292" y="84" class="v" text-anchor="end">48</text>
  <text x="24" y="112" class="l">Commits (last year)</text>
  <text x="292" y="112" class="v" text-anchor="end">551</text>
  <text x="24" y="140" class="l">Pull Requests</text>
  <text x="292" y="140" class="v" text-anchor="end">44</text>
  <text x="24" y="168" class="l">Issues</text>
  <text x="292" y="168" class="v" text-anchor="end">4</text>
  <text x="24" y="196" class="l">Repositories</text>
  <text x="292" y="196" class="v" text-anchor="end">49</text>
  <text x="24" y="224" class="l">Followers</text>
  <text x="292" y="224" class="v" text-anchor="end">37</text>

  
  <rect x="342" y="0" width="316" height="260" rx="18" fill="#0A0E1A" stroke="#1C2438"/>
  <rect x="360" y="0" width="280" height="3" fill="url(#accent)"/>
  <text x="366" y="40" class="t">STREAK</text>
  <circle cx="500" cy="120" r="52" fill="none" stroke="#141B33" stroke-width="6"/>
  <circle cx="500" cy="120" r="52" fill="none" stroke="#FFC53D" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="108.9 326.7" transform="rotate(-90 500 120)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="133" class="big" text-anchor="middle">2</text>
  <text x="500" y="198" class="l" text-anchor="middle" letter-spacing="3">DAY STREAK</text>
  <text x="366" y="236" class="l">Longest <tspan class="v">6</tspan></text>
  <text x="634" y="236" class="l" text-anchor="end">Last year <tspan class="v">656</tspan></text>

  
  <rect x="684" y="0" width="316" height="260" rx="18" fill="#0A0E1A" stroke="#1C2438"/>
  <rect x="702" y="0" width="280" height="3" fill="url(#accent)"/>
  <text x="708" y="40" class="t">TOP LANGUAGES</text>
  <text x="708" y="78" class="l">TypeScript</text>
  <text x="976" y="78" class="l" text-anchor="end">45.5%</text>
  <rect x="708" y="86" width="268" height="6" rx="3" fill="#141B33"/>
  <rect x="708" y="86" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" from="0" to="268" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="708" y="112" class="l">Python</text>
  <text x="976" y="112" class="l" text-anchor="end">31.9%</text>
  <rect x="708" y="120" width="268" height="6" rx="3" fill="#141B33"/>
  <rect x="708" y="120" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" from="0" to="188" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="708" y="146" class="l">Shell</text>
  <text x="976" y="146" class="l" text-anchor="end">15.0%</text>
  <rect x="708" y="154" width="268" height="6" rx="3" fill="#141B33"/>
  <rect x="708" y="154" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" from="0" to="89" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="708" y="180" class="l">JavaScript</text>
  <text x="976" y="180" class="l" text-anchor="end">5.5%</text>
  <rect x="708" y="188" width="268" height="6" rx="3" fill="#141B33"/>
  <rect x="708" y="188" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" from="0" to="32" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="708" y="214" class="l">CSS</text>
  <text x="976" y="214" class="l" text-anchor="end">1.0%</text>
  <rect x="708" y="222" width="268" height="6" rx="3" fill="#141B33"/>
  <rect x="708" y="222" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" from="0" to="6" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
</svg>
